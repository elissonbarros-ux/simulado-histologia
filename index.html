<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Simulado Histologia</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
}

.center{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#020617;
    padding:30px;
    border-radius:22px;
    box-shadow:0 0 30px rgba(0,0,0,.55);
}

.menu-card{
    width:440px;
    text-align:center;
    animation:entrada .7s ease;
}

@keyframes entrada{
    from{
        opacity:0;
        transform:translateY(30px) scale(.96);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.logo{
    font-size:48px;
    margin-bottom:5px;
}

.menu-card h1{
    margin:10px 0;
    font-size:32px;
}

.menu-card p{
    color:#cbd5e1;
    margin-bottom:25px;
}

.botoes{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.botoes button{
    min-width:120px;
    padding:15px 18px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    background:linear-gradient(135deg,#1e293b,#334155);
    color:white;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
    transition:.25s;
}

.botoes button:hover{
    transform:translateY(-4px) scale(1.04);
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:#052e16;
}

.botoes button:active{
    transform:scale(.96);
}

.topbar{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}

.badge{
    background:#1e293b;
    padding:10px 15px;
    border-radius:10px;
}

.progress{
    height:10px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:15px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#22c55e;
}

button{
    padding:14px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

.option{
    width:100%;
    background:#1e293b;
    color:white;
    text-align:left;
}

.option:hover{
    background:#334155;
}

.correct{
    background:#16a34a!important;
}

.wrong{
    background:#dc2626!important;
}

.next{
    width:100%;
    margin-top:10px;
    background:#22c55e;
    color:#052e16;
    font-weight:bold;
}

img{
    width:100%;
    max-height:400px;
    object-fit:contain;
    border-radius:12px;
    background:white;
    cursor:pointer;
}

.feedback{
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    text-align:left;
}

.ok{
    background:#052e16;
    border-left:5px solid #22c55e;
}

.err{
    background:#450a0a;
    border-left:5px solid #ef4444;
}

#zoom{
    display:none;
    position:fixed;
    inset:0;
    background:black;
    align-items:center;
    justify-content:center;
    z-index:999;
}

#zoom img{
    max-width:90%;
    max-height:90vh;
}

.result{
    text-align:center;
}

@media(max-width:600px){
    .menu-card{
        width:90%;
    }

    .botoes{
        flex-direction:column;
    }

    .botoes button{
        width:100%;
    }

    .topbar{
        flex-direction:column;
        gap:10px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="zoom" onclick="this.style.display='none'">
    <img id="zoomImg">
</div>

<script>
const banco = [
{img:"img/adiposo.jpg",q:"Qual tecido?",a:["Adiposo","Muscular","Epitelial","Nervoso"],c:0,exp:"Células grandes e claras, chamadas adipócitos.",erro:"Outros tecidos não têm células com aspecto de bolha.",dica:"Bolhas grandes = gordura."},

{img:"img/musculo_esqueletico.jpg",q:"Qual músculo?",a:["Liso","Cardíaco","Esquelético","Conjuntivo"],c:2,exp:"Possui estriações bem visíveis.",erro:"Sem estrias não seria músculo esquelético.",dica:"Listras = músculo esquelético."},

{img:"img/musculo_liso.jpg",q:"Qual músculo?",a:["Liso","Cardíaco","Esquelético","Ósseo"],c:0,exp:"Não possui estriações.",erro:"Se não tem listra, não é estriado.",dica:"Sem listra = músculo liso."},

{img:"img/musculo_cardiaco.jpg",q:"Qual músculo?",a:["Liso","Cardíaco","Esquelético","Epitelial"],c:1,exp:"Apresenta discos intercalares.",erro:"O músculo esquelético não possui discos intercalares.",dica:"Estria + discos = cardíaco."},

{img:"img/conjuntivo_denso.jpg",q:"Qual tecido?",a:["Frouxo","Denso","Adiposo","Cartilagem"],c:1,exp:"Fibras colágenas compactas e organizadas.",erro:"O conjuntivo frouxo teria fibras mais soltas.",dica:"Fibras alinhadas = conjuntivo denso."},

{img:"img/conjuntivo_frouxo.jpg",q:"Qual tecido?",a:["Frouxo","Denso","Muscular","Ósseo"],c:0,exp:"Fibras dispersas e mais espaço entre elas.",erro:"O tecido denso é mais compacto.",dica:"Muito espaço = conjuntivo frouxo."},

{img:"img/epitelio_estratificado.jpg",q:"Tipo de epitélio?",a:["Simples","Estratificado","Pseudoestratificado","Muscular"],c:1,exp:"Possui várias camadas de células.",erro:"Epitélio simples tem apenas uma camada.",dica:"Várias camadas = estratificado."},

{img:"img/pseudoestratificado.jpg",q:"Tipo de epitélio?",a:["Simples","Estratificado","Pseudoestratificado","Conjuntivo"],c:2,exp:"Parece ter várias camadas, mas os núcleos estão em alturas diferentes.",erro:"Não são várias camadas verdadeiras.",dica:"Parece estratificado, mas é pseudo."},

{img:"img/epitelio_simples.jpg",q:"Pegadinha: essa imagem representa melhor:",a:["Epitélio simples","Túbulo renal","Muscular","Cartilagem"],c:1,exp:"É uma estrutura de rim, com túbulos revestidos por epitélio simples.",erro:"A resposta mais específica é túbulo renal.",dica:"Imagem de órgão pede identificação mais específica."},

{img:"img/osso.jpg",q:"Qual tecido?",a:["Ósseo","Cartilagem","Conjuntivo","Adiposo"],c:0,exp:"Apresenta matriz rígida e mineralizada.",erro:"Cartilagem não apresenta essa rigidez mineralizada.",dica:"Aspecto rígido = tecido ósseo."},

{img:"img/cartilagem_hialina.jpg",q:"Qual cartilagem?",a:["Hialina","Fibrosa","Elástica","Óssea"],c:0,exp:"Tem matriz homogênea e condrócitos em lacunas.",erro:"Outras cartilagens apresentam mais fibras visíveis.",dica:"Lacunas claras = cartilagem hialina."},

{img:"img/cartilagem_fibrosa.jpg",q:"Qual cartilagem?",a:["Hialina","Fibrosa","Elástica","Adiposa"],c:1,exp:"Possui muitas fibras colágenas.",erro:"Pode confundir com conjuntivo denso, mas possui condrócitos em lacunas.",dica:"Muitas fibras + lacunas = fibrosa."},

{img:"img/cartilagem_elastica.jpg",q:"Qual cartilagem?",a:["Elástica","Hialina","Fibrosa","Muscular"],c:0,exp:"Tem matriz mais irregular e fibras elásticas.",erro:"A hialina é mais homogênea.",dica:"Mais irregular = cartilagem elástica."}
];

while(banco.length < 30){
    banco.push(...banco.slice(0,5));
}

let perguntas = [];
let atual = 0;
let acertos = 0;
let erros = 0;
let listaErros = [];

function inicio(){
    document.body.className = "center";

    document.getElementById("app").innerHTML = `
        <div class="card menu-card">
            <div class="logo">🧬</div>
            <h1>Simulado de Histologia</h1>
            <p>Treine identificação de tecidos com imagens reais.</p>

            <div class="botoes">
                <button onclick="start(10)">10 questões</button>
                <button onclick="start(20)">20 questões</button>
                <button onclick="start(30)">30 questões</button>
            </div>
        </div>
    `;
}

function start(qtd){
    document.body.className = "";
    perguntas = [...banco].sort(() => Math.random() - 0.5).slice(0,qtd);
    atual = 0;
    acertos = 0;
    erros = 0;
    listaErros = [];
    load();
}

function load(){
    let q = perguntas[atual];
    let prog = (atual / perguntas.length) * 100;

    let html = `
        <div class="container">
            <div class="card">
                <div class="topbar">
                    <div class="badge">Questão ${atual + 1}/${perguntas.length}</div>
                    <div class="badge">✅ ${acertos} | ❌ ${erros}</div>
                </div>

                <div class="progress">
                    <div class="progress-fill" style="width:${prog}%"></div>
                </div>

                <img src="${q.img}" onclick="zoom('${q.img}')">

                <p>${q.q}</p>
    `;

    q.a.forEach((alt,i)=>{
        html += `<button class="option" onclick="responder(${i})">${alt}</button>`;
    });

    html += `<div id="feedback"></div></div></div>`;

    document.getElementById("app").innerHTML = html;
}

function responder(i){
    let q = perguntas[atual];
    let btns = document.querySelectorAll(".option");

    btns.forEach((b,index)=>{
        b.disabled = true;
        if(index === q.c) b.classList.add("correct");
        if(index === i && i !== q.c) b.classList.add("wrong");
    });

    let fb = document.getElementById("feedback");

    if(i === q.c){
        acertos++;
        fb.innerHTML = `
            <div class="feedback ok">
                <h3>✅ Acertou</h3>
                <p>${q.exp}</p>
                <p><strong>Dica:</strong> ${q.dica}</p>
                <button class="next" onclick="next()">Próxima</button>
            </div>
        `;
    }else{
        erros++;
        listaErros.push(q);
        fb.innerHTML = `
            <div class="feedback err">
                <h3>❌ Errou</h3>
                <p><strong>Correta:</strong> ${q.a[q.c]}</p>
                <p>${q.exp}</p>
                <p><strong>Erro:</strong> ${q.erro}</p>
                <p><strong>Dica:</strong> ${q.dica}</p>
                <button class="next" onclick="next()">Próxima</button>
            </div>
        `;
    }
}

function next(){
    atual++;

    if(atual < perguntas.length){
        load();
    }else{
        resultado();
    }
}

function resultado(){
    let total = perguntas.length;
    let perc = Math.round((acertos / total) * 100);

    let html = `
        <div class="container">
            <div class="card result">
                <h2>Resultado Final</h2>
                <h1>${perc}%</h1>
                <p>✅ Acertos: ${acertos}</p>
                <p>❌ Erros: ${erros}</p>
                <button onclick="inicio()">Refazer</button>
    `;

    if(listaErros.length){
        html += "<h3>Revisão dos erros</h3>";

        listaErros.forEach(e=>{
            html += `
                <div class="feedback err">
                    <img src="${e.img}">
                    <p>${e.q}</p>
                    <p><strong>Correta:</strong> ${e.a[e.c]}</p>
                    <p>${e.exp}</p>
                    <p><strong>Dica:</strong> ${e.dica}</p>
                </div>
            `;
        });
    }

    html += "</div></div>";

    document.getElementById("app").innerHTML = html;
}

function zoom(src){
    document.getElementById("zoomImg").src = src;
    document.getElementById("zoom").style.display = "flex";
}

inicio();
</script>

</body>
</html>
